# Lectura diaria de "guardada N veces" a las 11:53 de Tallin. Si falla, el run queda en rojo
# (GitHub envía el aviso de fallo por correo a quien creó/modificó el cron).
name: Lectura diaria
on:
  # Principal 11:53 Tallin + dos respaldos (el lector no duplica: si el día ya existe, no añade fila).
  # El de UTC no usa `timezone`: 10:23 UTC = 12:23 Tallin en invierno (UTC+2), 13:23 en verano (UTC+3).
  schedule:
    - cron: '53 11 * * *'
      timezone: 'Europe/Tallinn'
    - cron: '23 12 * * *'
      timezone: 'Europe/Tallinn'
    - cron: '23 10 * * *'
  workflow_dispatch:
  # Disparo puntual: la rutina en la nube de Claude sube un commit vacío a esta rama a las 11:53.
  push:
    branches: ['disparo-lectura']
permissions:
  contents: write
concurrency:
  group: lectura-diaria
  cancel-in-progress: false
jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre se lee y escribe sobre main, también si lo dispara la rama disparo-lectura
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Leer y añadir fila
        run: node scripts/leer.mjs --tipo diaria --evidencia evidencia-run
      - name: Commit del CSV
        run: |
          if git diff --quiet -- data/lecturas.csv; then echo "Sin cambios en el CSV"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lecturas.csv
          git commit -m "Lectura diaria $(tail -1 data/lecturas.csv | cut -d, -f1)"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-lectura
          path: evidencia-run/
          retention-days: 30
